<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Trailboard</title>
  <desc>A page seen from the front, in Tokyo Night colors: a dark browser card with an address bar and a lilac link, whose lilac trail runs down and turns into a new blue page beside it, so the pieces make a lowercase t. Each piece has a hard shadow, on a transparent background.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#7dcfff"/>
    </linearGradient>
  </defs>
  <g transform="translate(256 256) scale(1.3) translate(-256 -262)">
    <!-- The page the link is on; one hard shadow, as Omarchy's own app icons. -->
    <rect x="76" y="96" width="360" height="132" rx="22" fill="#0e0f17" transform="translate(0 8)"/>
    <rect x="76" y="96" width="360" height="132" rx="22" fill="#1a1b26" stroke="#3b4261" stroke-width="3"/>
    <!-- The trail, from under the link down and into the new page. -->
    <path d="M176 230V318Q176 346 204 346H244" fill="none" stroke="#0e0f17" stroke-width="40" stroke-linecap="round" transform="translate(0 8)"/>
    <path d="M176 230V318Q176 346 204 346H244" fill="none" stroke="#bb9af7" stroke-width="40" stroke-linecap="round"/>
    <!-- Address bar, then a line of text whose first words are the link. -->
    <rect x="112" y="132" width="288" height="28" rx="14" fill="#3b4261"/>
    <rect x="130" y="139" width="14" height="14" rx="7" fill="#7aa2f7"/>
    <rect x="128" y="180" width="96" height="16" rx="8" fill="#bb9af7"/>
    <rect x="236" y="180" width="128" height="16" rx="8" fill="#565f89" opacity=".55"/>
    <!-- The new page, opened beside its source. -->
    <rect x="236" y="268" width="200" height="160" rx="20" fill="#0e0f17" transform="translate(0 8)"/>
    <rect x="236" y="268" width="200" height="160" rx="20" fill="url(#page)"/>
    <rect x="268" y="304" width="112" height="18" rx="9" fill="#0e0f17" opacity=".4"/>
    <rect x="268" y="338" width="136" height="14" rx="7" fill="#0e0f17" opacity=".25"/>
    <rect x="268" y="366" width="88" height="14" rx="7" fill="#0e0f17" opacity=".25"/>
  </g>
</svg>
