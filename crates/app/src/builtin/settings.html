<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings</title>
<style>
/* The settings page, laid out like the app's own chrome (docs/DESIGN.md):
   the card is level 1, the groups of settings level 2 (the panels), what
   is under the pointer level 3. Text in three strengths. The accent marks
   a switch that is on, the section in view and the main button; nothing
   else. Colours come from the app (`tbTheme`), corners follow Hyprland.
   Motion (docs/DESIGN.md, "Motion on app pages"): the sections are stops
   on a trail in the side column, and a bead rides it as you scroll;
   headings dock while their section is under them; rows rise as they
   come in; a choice's raised thumb slides to it; a change says "Saved";
   filtering moves rows to their new places. Nothing loops. */
:root {
  --bg: #1b1c22; --fg: #e6e6e9; --dim: #a0a0a8; --faint: #7a7a83;
  --accent: #ffd60a; --accentfg: #000; --accenttext: #ffd60a; --accentsoft: #4a4426;
  --card: #24252c; --hover: #2c2d35; --well: #1d1e24; --rule: #34353d; --rulestrong: #4a4b55;
  --danger: #f7768e; --shade: #000;
  --radius: 0px;
  --r: min(10px, var(--radius)); --r-sm: min(6px, var(--radius));
  --font: "Inter", "Adwaita Sans", system-ui, sans-serif;
  --out: cubic-bezier(.22, .9, .28, 1);
  --spring: linear(0, .25 6%, .6 14%, .86 23%, 1.02 33%, 1.035 40%, 1.01 54%, .998 70%, 1);
  color-scheme: dark;
}
:root.light { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 13px/1.5 var(--font); font-feature-settings: "cv11", "tnum";
  -webkit-font-smoothing: antialiased;
  display: grid; grid-template-columns: 252px 1fr; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accenttext); outline-offset: 2px; }
/* Fields show focus with their own border and ring. */
input:focus-visible, select:focus-visible { outline: none; }
::selection { background: var(--accentsoft); }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5;
  stroke-linecap: round; stroke-linejoin: round; }

/* ---- the side column: title, search, sections ---- */
nav { display: flex; flex-direction: column; gap: 2px; padding: 20px 12px; overflow-y: auto;
  border-right: 1px solid var(--rule); }
nav h1 { margin: 4px 8px 14px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.find { position: relative; margin: 0 0 12px; }
.find svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--dim); pointer-events: none; }
.find input { width: 100%; height: 32px; padding: 0 30px 0 32px; border-radius: var(--r-sm);
  border: 1px solid var(--rule); background: var(--well); }
.find input::placeholder { color: var(--faint); }
.find input:focus { border-color: var(--accenttext); box-shadow: 0 0 0 3px var(--accentsoft); }
.find input::-webkit-search-cancel-button { display: none; }
.find kbd { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); }
.find input:focus ~ kbd, .find input:not(:placeholder-shown) ~ kbd { display: none; }
/* the sections as stops on a trail; the bead is where you are */
.links { position: relative; display: flex; flex-direction: column; gap: 2px; padding-left: 18px; --at: 16px; --top: 16px; --end: 16px; }
.links::before, .links::after { content: ""; position: absolute; left: 6px; width: 1.5px; border-radius: 1px; top: var(--top); }
.links::before { height: calc(var(--end) - var(--top)); background: var(--rule); }
.links::after { height: calc(var(--at) - var(--top)); background: var(--accent); }
.links .bead { position: absolute; left: 2px; top: 0; z-index: 1; width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent); box-shadow: 0 0 0 3px var(--bg); transform: translateY(calc(var(--at) - 5px)); }
nav a { position: relative; display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: var(--r-sm);
  color: var(--dim); text-decoration: none; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background .15s, color .15s, transform .45s var(--spring); }
nav a::before { content: ""; position: absolute; left: -14px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%;
  background: var(--bg); box-shadow: 0 0 0 1.5px var(--rulestrong); transition: box-shadow .2s, background .2s; }
nav a.past::before { background: var(--accent); box-shadow: 0 0 0 1.5px var(--accent); }
nav a:hover { background: var(--hover); color: var(--fg); }
nav a.on { color: var(--fg); font-weight: 600; transform: translateX(3px); }
nav a.on svg { color: var(--accenttext); }
nav a svg { transition: color .2s, transform .45s var(--spring); }
nav a:hover svg { transform: scale(1.12); }
nav a .n { margin-left: auto; font-size: 11px; color: var(--faint); font-weight: 500; }

kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px;
  font: 600 11px/1 var(--font); color: var(--dim); background: var(--hover);
  border: 1px solid color-mix(in srgb, var(--rulestrong) 55%, transparent); border-radius: min(4px, var(--radius)); }

/* ---- the sections ---- */
main { overflow-y: auto; scroll-behavior: smooth; }
.wrap { max-width: 700px; margin: 0 auto; padding: 32px 40px 35vh; }
section { margin: 0 0 36px; scroll-margin-top: 24px; }
/* a heading docks at the top while its section is under it */
section h2 { position: sticky; top: 0; z-index: 2; container-type: scroll-state; margin: 0 -12px 4px; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
section h2 .h { display: flex; align-items: center; gap: 10px; padding: 10px 12px 6px; border-bottom: 1px solid transparent;
  background: transparent; transition: background .2s, border-color .2s, padding .3s var(--out), font-size .3s var(--out); }
@container scroll-state(stuck: top) {
  .h { background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-color: var(--rule) !important;
    padding-top: 8px !important; padding-bottom: 8px !important; font-size: 15px; }
}
section h2 svg { width: 18px; height: 18px; color: var(--dim); }
section:first-child h2 .h { padding-top: 0; }
section .about { margin: 0 0 14px 28px; color: var(--dim); }
.box { background: var(--card); border: 1px solid var(--rule); border-radius: var(--r); }
.row { display: flex; align-items: center; gap: 24px; min-height: 56px; padding: 12px 16px; }
.row + .row, .row + .actions { border-top: 1px solid var(--rule); }
.row .text { flex: 1; min-width: 0; }
.row .label { font-weight: 600; }
.row .note { margin-left: 8px; font: 500 11px/1 ui-monospace, "JetBrains Mono", monospace; padding: 3px 6px;
  border-radius: min(4px, var(--radius)); color: var(--dim); background: var(--hover); vertical-align: 1px; }
.row .help { margin-top: 2px; font-size: 12px; color: var(--dim); }
.row .ctl { flex: none; display: flex; align-items: center; gap: 8px; }
/* "Saved", beside a setting just changed */
.row .ok { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; font-size: 11.5px; font-weight: 600; color: var(--accenttext);
  vertical-align: 1px; opacity: 0; }
.row .ok svg { width: 12px; height: 12px; stroke-width: 2; }
.row .ok path { stroke-dasharray: 1; stroke-dashoffset: 1; }
.row.saved .ok { animation: ok 1.6s var(--out) var(--late, 0s) both; }
.row.saved .ok path { animation: tick .45s var(--out) calc(var(--late, 0s) + .05s) both; }
@keyframes ok { 0% { opacity: 0; transform: translateX(-4px); } 12%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
@keyframes tick { to { stroke-dashoffset: 0; } }
@supports ((animation-timeline: view()) and (animation-range: entry)) {
  .box > .row, .box > .actions, .box > .kw, .box > .sub { animation: rise linear both; animation-timeline: view(); animation-range: entry 0% entry 60%; }
}
@keyframes rise { from { opacity: 0; transform: translateY(14px); } }
.row.lit { animation: lit 1.4s ease-out; }
@keyframes lit { from { background: var(--accentsoft); } }
.sub { display: flex; gap: 8px; padding: 0 16px 14px; margin-top: -2px; }
.sub input { flex: 1; height: 32px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--rule);
  background: var(--well); font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 12px; }
.sub.range { align-items: center; gap: 12px; }
.sub.range input { flex: 1; height: auto; padding: 0; border: 0; background: none; accent-color: var(--accent); }
.sub.range output { min-width: 44px; text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
.sample { width: 28px; height: 20px; flex: none; border: 1.5px solid var(--rulestrong); background: var(--well); }
.sub input:focus { border-color: var(--accenttext); box-shadow: 0 0 0 3px var(--accentsoft); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px; }
.actions .gap { flex: 1; }

/* switch: off is a recess, on is the accent */
.switch { position: relative; width: 36px; height: 20px; flex: none; border: 0; padding: 0; cursor: pointer;
  border-radius: min(10px, var(--radius)); background: var(--rulestrong); transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
  border-radius: min(8px, var(--radius)); background: var(--fg); transition: transform .5s var(--spring), width .2s var(--out), background .2s; }
.switch:active::after { width: 20px; }
.switch.on { background: var(--accent); }
.switch.on::after { transform: translateX(16px); background: var(--accentfg); }
.switch.on:active::after { transform: translateX(12px); }
/* a switch drawn already changed starts from where it was */
.switch.was::after { transform: translateX(16px); }
.switch.on.was::after { transform: none; }

/* a few choices side by side: the chosen one is raised, not coloured */
.seg { position: relative; display: inline-flex; padding: 2px; gap: 2px; border-radius: var(--r-sm); background: var(--well); border: 1px solid var(--rule); }
.seg button { position: relative; z-index: 1; height: 26px; border: 0; padding: 0 11px; background: transparent; cursor: pointer; white-space: nowrap;
  border-radius: max(0px, min(var(--radius) - 2px, 4px)); font-size: 12px; font-weight: 500; color: var(--dim); transition: color .2s; }
.seg button:hover { color: var(--fg); }
.seg button.on { color: var(--fg); font-weight: 600; }
/* one raised thumb, under the chosen button; it slides when the choice changes */
.seg .thumb { position: absolute; top: 2px; bottom: 2px; left: 0; width: 0; border-radius: max(0px, min(var(--radius) - 2px, 4px));
  background: var(--hover); box-shadow: 0 1px 2px color-mix(in srgb, var(--shade) 35%, transparent), inset 0 0 0 1px var(--rule);
  transition: transform .5s var(--spring), width .5s var(--spring); }

/* many choices: a drop-down */
.select { position: relative; }
.select select { height: 30px; min-width: 176px; padding: 0 30px 0 10px; border-radius: var(--r-sm); cursor: pointer;
  border: 1px solid var(--rule); background: var(--well); appearance: none; -webkit-appearance: none; }
.select select:hover { border-color: var(--rulestrong); }
.select select:focus-visible { border-color: var(--accenttext); box-shadow: 0 0 0 3px var(--accentsoft); }
.select svg { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); width: 12px; height: 12px; color: var(--dim); pointer-events: none; }

.btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; border-radius: var(--r-sm);
  border: 1px solid var(--rule); background: var(--hover); cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; }
.btn:hover { border-color: var(--rulestrong); }
.btn.primary { background: var(--accent); color: var(--accentfg); border-color: transparent; }
.btn.danger { background: transparent; color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, transparent); }
.btn.danger:hover { background: color-mix(in srgb, var(--danger) 12%, transparent); }
.btn svg { width: 14px; height: 14px; }

/* the search keywords: a list (click a row to change it) and a form to add one */
.kw { border-top: 1px solid var(--rule); max-height: 324px; overflow-y: auto; padding: 4px 0; }
.kwrow { display: grid; grid-template-columns: 72px minmax(0, 150px) minmax(0, 1fr) 24px; align-items: center; gap: 12px;
  height: 34px; padding: 0 12px 0 16px; cursor: pointer; }
.kwrow:hover, .kwrow.on { background: var(--hover); }
.kwrow code { justify-self: start; font: 600 12px/1 ui-monospace, "JetBrains Mono", monospace; padding: 4px 6px;
  border-radius: min(4px, var(--radius)); background: var(--well); border: 1px solid var(--rule); }
.kwrow .name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kwrow .url { color: var(--dim); font: 12px ui-monospace, "JetBrains Mono", monospace; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kwrow .x { width: 24px; height: 24px; display: grid; place-items: center; border: 0; padding: 0; background: transparent;
  border-radius: var(--r-sm); color: var(--faint); cursor: pointer; visibility: hidden; }
.kwrow:hover .x, .kwrow .x:focus-visible { visibility: visible; }
.kwrow .x:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
.kwrow .x svg { width: 14px; height: 14px; }
.kwempty { padding: 10px 16px; color: var(--dim); }
.sub.kwadd { padding-top: 12px; margin-top: 0; border-top: 1px solid var(--rule); }
.sub.kwadd #kwKey { flex: none; width: 88px; }
.sub.kwadd #kwName { flex: none; width: 140px; font-family: var(--font); font-size: 13px; }

.fact .value { font-weight: 500; color: var(--dim); text-align: right; max-width: 280px; overflow-wrap: anywhere; }
.empty { padding: 72px 0; text-align: center; color: var(--dim); animation: fade .3s var(--out); }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } }
/* filtering: rows and sections move to their new places */
::view-transition-group(*) { animation-duration: .32s; animation-timing-function: var(--out); }
::view-transition-old(*), ::view-transition-new(*) { animation-duration: .2s; }
/* arriving: once */
body.intro nav a { transition: opacity .4s var(--out), transform .6s var(--out); transition-delay: calc(sibling-index() * 30ms); }
body.intro .wrap > section { transition: opacity .45s var(--out), transform .7s var(--out); transition-delay: calc(.08s + sibling-index() * 60ms); }
body.intro nav h1, body.intro .find { transition: opacity .4s var(--out), transform .6s var(--out); }
@starting-style {
  body.intro nav a { opacity: 0; transform: translateX(-10px); }
  body.intro .wrap > section { opacity: 0; transform: translateY(22px); }
  body.intro nav h1, body.intro .find { opacity: 0; transform: translateY(-6px); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
:root.still *, :root.still *::before, :root.still *::after { transition: none !important; animation: none !important; }
.empty b { display: block; margin-bottom: 4px; font-size: 15px; color: var(--fg); font-weight: 600; }
mark { background: var(--accentsoft); color: inherit; border-radius: 2px; padding: 0 1px; }

/* A narrow card: one column, the sections as a strip under the search. */
@media (max-width: 720px) {
  body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  nav { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 4px; padding: 12px 16px;
    border-right: 0; border-bottom: 1px solid var(--rule); overflow: visible; }
  nav h1 { margin: 0 12px 0 0; font-size: 15px; }
  .find { flex: 1; min-width: 160px; margin: 0; }
  .links { flex-basis: 100%; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  nav a { height: 28px; padding: 0 8px; }
  nav a svg, nav a .n { display: none; }
  .links { flex-direction: row; padding-left: 0; }
  .links::before, .links::after, .links .bead, nav a::before { display: none; }
  nav a.on { background: var(--hover); transform: none; }
  .wrap { padding: 20px 16px 35vh; }
  section .about { margin-left: 0; }
  section h2 svg { display: none; }
  .row { flex-wrap: wrap; gap: 10px 16px; }
  .kwrow { grid-template-columns: 64px minmax(0, 1fr) 24px; }
  .kwrow .url { display: none; }
  .sub.kwadd { flex-wrap: wrap; }
  .sub.kwadd #kwUrl { flex-basis: 100%; }
}
</style>
</head>
<body>
<nav id="nav">
  <h1>Settings</h1>
  <label class="find">
    <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8 20 20"/></svg>
    <input id="find" type="search" placeholder="Search settings" autocomplete="off" spellcheck="false" aria-label="Search settings">
    <kbd>/</kbd>
  </label>
  <div class="links" id="links"></div>
</nav>
<main id="main"><div class="wrap" id="body"></div></main>
<script>
const PREFIX = __PREFIX__;
let D = __DATA__;
const $ = (id) => document.getElementById(id);
const root = document.documentElement;
function act(msg, rest) { console.log(PREFIX + msg + (rest || "")); }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
let query = "";
let proxyDraft = null;
// The keyword being typed in the form (kept while the page redraws).
let kwDraft = { key: "", name: "", url: "" };

// Each section's icon and one line on what it covers; the strokes follow
// the app's own icon set (24-unit grid, round ends).
const ICON = {
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8 20 20"/>',
  appearance: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17"/><path d="M12 7.5h4M12 11.5h7M12 15.5h5"/>',
  privacy: '<path d="M12 3l7 2.8v5.7l-1.6 4.7L12 21l-5.4-4.8L5 11.5V5.8z"/>',
  content: '<rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="m20.5 15.5-4.5-4.5-8.5 8.5"/>',
  permissions: '<rect x="5" y="11" width="14" height="9.5" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  languages: '<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17"/><ellipse cx="12" cy="12" rx="3.7" ry="8.5"/>',
  downloads: '<path d="M12 4v11M7 10.5l5 5 5-5M5 20h14"/>',
  system: '<path d="M4 17a8 8 0 1 1 16 0"/><path d="m12 17 4-5"/>',
  about: '<circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5"/><circle cx="12" cy="7.8" r=".6" fill="currentColor"/>',
};
const ABOUT = {
  search: "Where searches go, and what a new card starts as.",
  appearance: "How pages and the board look and move.",
  privacy: "What is blocked, sent and remembered.",
  content: "What sites may run and show.",
  permissions: "What a site gets when it asks.",
  languages: "What sites are asked for, and spelling.",
  downloads: "Where files go.",
  system: "Memory and how pages reach the internet.",
  about: "This copy of Trailboard and how it runs.",
};
// Buttons that lose something get a warning colour.
const DANGER = ["clear-history", "clear-cookies"];
const icon = (id, cls = "i") => `<svg class="${cls}" viewBox="0 0 24 24">${ICON[id] || ICON.about}</svg>`;
const CHEVRON = '<svg class="i" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';

function words(q) { return q.split(/\s+/).filter(Boolean); }
function hit(it) {
  if (!query) return true;
  const hay = (it.label + " " + it.help + " " + it.words + " " + it.choices.map((c) => c[1]).join(" ")).toLowerCase();
  return words(query).every((w) => hay.includes(w));
}
function mark(s) {
  let out = esc(s);
  for (const w of words(query)) {
    out = out.replace(new RegExp("(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi"), "<mark>$1</mark>");
  }
  return out;
}

function control(it) {
  if (it.kind === "switch") {
    const on = it.value === "on";
    return `<button class="switch${on ? " on" : ""}${flipped === it.key ? " was" : ""}" role="switch" aria-checked="${on}" aria-label="${esc(it.label)}" data-key="${it.key}" data-v="${on ? "off" : "on"}"></button>`;
  }
  if (it.kind === "segment") {
    return `<div class="seg" role="radiogroup" aria-label="${esc(it.label)}" data-seg="${it.key}"><span class="thumb"></span>${it.choices.map(([id, name]) =>
      `<button role="radio" aria-checked="${id === it.value}" class="${id === it.value ? "on" : ""}" data-key="${it.key}" data-v="${esc(id)}">${esc(name)}</button>`).join("")}</div>`;
  }
  return `<span class="select"><select data-key="${it.key}" aria-label="${esc(it.label)}">${it.choices.map(([id, name]) =>
    `<option value="${esc(id)}"${id === it.value ? " selected" : ""}>${esc(name)}</option>`).join("")}</select>${CHEVRON}</span>`;
}

function row(it) {
  const extra = it.key === "search" ? `<button class="btn" data-act="engines">Compare</button>` : "";
  let html = `<div class="row" data-k="${it.key}" style="view-transition-name:r-${it.key}"><div class="text"><div class="label">${mark(it.label)}${
    it.note ? `<span class="note" title="Set for this run">${esc(it.note)}</span>` : ""}<span class="ok" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path pathLength="1" d="M5 12.5 10 17.5 19 7"/></svg>Saved</span></div><div class="help">${mark(it.help)}</div></div><div class="ctl">${extra}${control(it)}</div></div>`;
  if (it.key === "proxy" && it.value === "custom") {
    const v = proxyDraft ?? D.proxyServer;
    html += `<div class="sub"><input id="proxy" placeholder="127.0.0.1:8080 or socks5://host:1080" value="${esc(v)}" spellcheck="false" aria-label="Proxy server"><button class="btn primary" id="proxySave">Save</button></div>`;
  }
  if (it.key === "corners" && it.value === "custom") {
    html += `<div class="sub range"><span class="sample" id="radiusSample" style="border-radius:${D.cornerRadius}px"></span><input id="radius" type="range" min="0" max="${D.maxCornerRadius}" step="1" value="${D.cornerRadius}" aria-label="Corner radius in pixels"><output id="radiusOut">${D.cornerRadius} px</output></div>`;
  }
  return html;
}

// ---- search keywords ----
const CROSS = '<svg class="i" viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>';
function kwHit() {
  if (!query) return true;
  const hay = ("search keywords keyword shortcut " + D.keywords.map((k) => k.join(" ")).join(" ")).toLowerCase();
  return words(query).every((w) => hay.includes(w));
}
function keywords() {
  const key = kwDraft.key.trim().toLowerCase();
  const known = D.keywords.some(([k]) => k === key);
  const list = D.keywords.length
    ? D.keywords.map(([k, n, u]) => `<div class="kwrow${k === key ? " on" : ""}" data-kw="${esc(k)}" title="Click to change"><code>${mark(k)}</code><span class="name">${mark(n)}</span><span class="url">${esc(u)}</span><button class="x" data-kwx="${esc(k)}" aria-label="Remove ${esc(k)}">${CROSS}</button></div>`).join("")
    : `<div class="kwempty">No keywords. Add one below, or bring back the defaults.</div>`;
  return `<div class="row" data-k="keywords"><div class="text"><div class="label">${mark("Search keywords")}</div><div class="help">${mark("Type a keyword, a space and your search in the address bar, o, O or :open. gh rust searches GitHub for “rust”.")}</div></div><div class="ctl"><button class="btn" id="kwReset">Defaults</button></div></div>`
    + `<div class="kw" id="kwList">${list}</div>`
    + `<div class="sub kwadd"><input id="kwKey" placeholder="Keyword" value="${esc(kwDraft.key)}" spellcheck="false" aria-label="Keyword"><input id="kwName" placeholder="Name" value="${esc(kwDraft.name)}" spellcheck="false" aria-label="Name"><input id="kwUrl" placeholder="https://example.com/search?q={}" value="${esc(kwDraft.url)}" spellcheck="false" aria-label="Search address, {} for the search"><button class="btn primary" id="kwSave">${known ? "Save" : "Add"}</button></div>`;
}
function wireKeywords() {
  if (!$("kwSave")) return;
  for (const r of document.querySelectorAll("[data-kw]")) r.onclick = () => {
    const k = D.keywords.find(([x]) => x === r.dataset.kw);
    if (!k) return;
    kwDraft = { key: k[0], name: k[1], url: k[2] };
    render();
    $("kwUrl").focus();
  };
  for (const b of document.querySelectorAll("[data-kwx]")) b.onclick = (e) => { e.stopPropagation(); act("keyword-remove:", b.dataset.kwx); };
  $("kwReset").onclick = () => act("keyword-reset");
  const draft = () => { kwDraft = { key: $("kwKey").value, name: $("kwName").value, url: $("kwUrl").value }; };
  const save = () => { draft(); act("keyword-set:", [kwDraft.key, kwDraft.name, kwDraft.url].join("\t")); };
  for (const id of ["kwKey", "kwName", "kwUrl"]) {
    $(id).oninput = () => {
      draft();
      const known = D.keywords.some(([k]) => k === kwDraft.key.trim().toLowerCase());
      $("kwSave").textContent = known ? "Save" : "Add";
    };
    $(id).onkeydown = (e) => { if (e.key === "Enter") save(); };
  }
  $("kwSave").onclick = save;
}

function section(id, name, rows, actions) {
  return `<section id="s-${id}" style="view-transition-name:s-${id}"><h2><span class="h">${icon(id)}${mark(name)}</span></h2>${query ? "" : `<p class="about">${ABOUT[id] || ""}</p>`}<div class="box">${rows}${actions}</div></section>`;
}

function render() {
  const keepFocus = document.activeElement && document.activeElement.id;
  let html = "";
  const shown = [];
  for (const sec of D.sections) {
    const items = sec.items.filter(hit);
    const secHit = query && words(query).every((w) => sec.name.toLowerCase().includes(w));
    const kw = sec.id === "search" && (secHit || kwHit());
    if (!items.length && !secHit && !kw) continue;
    const list = items.length || (kw && !secHit) ? items : sec.items;
    shown.push({ id: sec.id, name: sec.name, n: query ? list.length : 0 });
    const links = !query || secHit ? sec.buttons : [];
    const actions = links.length
      ? `<div class="actions">${links.filter(([, c]) => !DANGER.includes(c)).map(([l, c]) => `<button class="btn" data-run="${c}">${esc(l)}</button>`).join("")}${
          links.some(([, c]) => DANGER.includes(c)) ? `<span class="gap"></span>` : ""}${
          links.filter(([, c]) => DANGER.includes(c)).map(([l, c]) => `<button class="btn danger" data-run="${c}">${esc(l)}</button>`).join("")}</div>`
      : "";
    html += section(sec.id, sec.name, list.map(row).join("") + (kw ? keywords() : ""), actions);
  }
  const facts = D.facts.filter(([l, v, m]) => !query || words(query).every((w) => (l + " " + v + " " + m).toLowerCase().includes(w)));
  if (facts.length) {
    shown.push({ id: "about", name: "About", n: query ? facts.length : 0 });
    html += section("about", "About", facts.map(([l, v, m]) =>
      `<div class="row fact"><div class="text"><div class="label">${mark(l)}</div><div class="help">${mark(m)}</div></div><div class="value">${esc(v)}</div></div>`).join(""), "");
  }
  $("body").innerHTML = html || `<div class="empty"><b>No settings match “${esc(query)}”</b>Try a different word, or clear the search with <kbd>Esc</kbd>.</div>`;
  $("links").innerHTML = `<span class="bead"></span>` + shown.map((s) => `<a data-s="${s.id}">${icon(s.id)}<span>${esc(s.name)}</span>${s.n ? `<span class="n">${s.n}</span>` : ""}</a>`).join("");
  for (const a of document.querySelectorAll("nav a")) a.onclick = () => $("s-" + a.dataset.s)?.scrollIntoView();
  for (const b of document.querySelectorAll("[data-key][data-v]")) b.onclick = () => set(b.dataset.key, b.dataset.v);
  for (const s of document.querySelectorAll("select[data-key]")) s.onchange = () => set(s.dataset.key, s.value);
  for (const b of document.querySelectorAll("[data-run]")) b.onclick = () => act("run:", b.dataset.run);
  for (const b of document.querySelectorAll("[data-act=engines]")) b.onclick = () => act("engines");
  const px = $("proxy");
  if (px) {
    const save = () => { proxyDraft = null; act("proxy-server:", px.value); };
    px.oninput = () => { proxyDraft = px.value; };
    px.onkeydown = (e) => { if (e.key === "Enter") save(); };
    $("proxySave").onclick = save;
  }
  const rd = $("radius");
  if (rd) {
    // The sample follows the slider; the app hears the value on release.
    rd.oninput = () => { $("radiusOut").textContent = rd.value + " px"; $("radiusSample").style.borderRadius = rd.value + "px"; };
    rd.onchange = () => { D.cornerRadius = +rd.value; act("corner-radius:", rd.value); };
  }
  wireKeywords();
  if (keepFocus && $(keepFocus)) $(keepFocus).focus();
  fitTail();
  spy();
  thumbs();
  // The setting changed last says so, carrying on through redraws.
  const since = Date.now() - saved.at;
  const done = since < 1600 && document.querySelector(`.row[data-k="${CSS.escape(saved.key)}"]`);
  if (done) { done.style.setProperty("--late", -since + "ms"); done.classList.add("saved"); }
  // A switch drawn as it changes slides over from its old side.
  if (flipped) {
    void document.body.offsetWidth;
    for (const w of document.querySelectorAll(".switch.was")) w.classList.remove("was");
    flipped = null;
  }
}

// Each choice's thumb sits under the chosen button; after a change it
// starts where the old choice was and slides over.
let thumbFrom = {};
function thumbs() {
  for (const seg of document.querySelectorAll(".seg[data-seg]")) {
    const th = seg.querySelector(".thumb"), on = seg.querySelector("button.on");
    if (!on) { th.style.width = "0"; continue; }
    const to = { x: on.offsetLeft, w: on.offsetWidth }, from = thumbFrom[seg.dataset.seg];
    if (from) {
      th.style.transition = "none";
      th.style.transform = `translateX(${from.x}px)`;
      th.style.width = from.w + "px";
      void th.offsetWidth;
      th.style.transition = "";
    }
    th.style.transform = `translateX(${to.x}px)`;
    th.style.width = to.w + "px";
  }
  thumbFrom = {};
}

// Leaves just enough room under the last section for it to scroll up to the
// top, so every section (About too) can be reached and lit in the side column.
function fitTail() {
  const wrap = $("body"), last = wrap.querySelector("section:last-of-type");
  if (!last) { wrap.style.paddingBottom = ""; return; }
  const cs = getComputedStyle(last);
  const room = $("main").clientHeight - parseFloat(cs.scrollMarginTop) - last.offsetHeight - parseFloat(cs.marginBottom);
  wrap.style.paddingBottom = Math.max(32, Math.ceil(room)) + "px";
}
window.addEventListener("resize", () => { fitTail(); spy(); });

// Shows the change at once; the app saves it and sends the data back.
let saved = { key: "", at: 0 }, flipped = null;
function set(key, v) {
  const seg = document.querySelector(`.seg[data-seg="${CSS.escape(key)}"] button.on`);
  if (seg) thumbFrom[key] = { x: seg.offsetLeft, w: seg.offsetWidth };
  if (document.querySelector(`.switch[data-key="${CSS.escape(key)}"]`)) flipped = key;
  saved = { key, at: Date.now() };
  for (const sec of D.sections) for (const it of sec.items) if (it.key === key) it.value = v;
  render();
  act("set:", key + "=" + v);
}

// The section in view is lit in the side column.
function spy() {
  const top = $("main").getBoundingClientRect().top + 80;
  let cur = null;
  for (const s of document.querySelectorAll("section")) if (s.getBoundingClientRect().top <= top) cur = s.id;
  if (!cur) cur = document.querySelector("section")?.id;
  const links = [...document.querySelectorAll("nav a")];
  links.forEach((a) => a.classList.toggle("on", "s-" + a.dataset.s === cur));
  // The bead rides the trail between stops as the sections pass.
  const secs = [...document.querySelectorAll("section")];
  if (!links.length || links.length !== secs.length) return;
  const mid = (a) => a.offsetTop + a.offsetHeight / 2;
  let f = 0;
  for (let i = 0; i < secs.length; i++) {
    const t = secs[i].getBoundingClientRect().top - top;
    if (t <= 0) {
      const next = secs[i + 1] ? secs[i + 1].getBoundingClientRect().top - top : 1;
      f = next > 0 ? i + Math.min(1, -t / (next - t)) : i + 1;
    }
  }
  const main = $("main");
  if (main.scrollTop + main.clientHeight >= main.scrollHeight - 2) f = secs.length - 1;
  f = Math.max(0, Math.min(secs.length - 1, f));
  const i = Math.floor(f), at = links[i + 1] ? mid(links[i]) + (mid(links[i + 1]) - mid(links[i])) * (f - i) : mid(links[i]);
  const box = $("links").style;
  box.setProperty("--at", at + "px");
  box.setProperty("--top", mid(links[0]) + "px");
  box.setProperty("--end", mid(links[links.length - 1]) + "px");
  links.forEach((a, k) => a.classList.toggle("past", k < f - 0.001 || k === i));
}
$("main").addEventListener("scroll", spy, { passive: true });
// Filtering moves what stays to its new place (a view transition), unless
// the desktop asks for less motion.
function refilter(q) {
  const go = () => { query = q; render(); $("main").scrollTop = 0; };
  if (document.startViewTransition && !root.classList.contains("still") && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(go);
  else go();
}
$("find").addEventListener("input", (e) => refilter(e.target.value.trim().toLowerCase()));
document.addEventListener("keydown", (e) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement?.tagName || "");
  if (e.key === "/" && !typing) { e.preventDefault(); $("find").focus(); $("find").select(); }
  else if (e.key === "Escape" && document.activeElement === $("find") && $("find").value) {
    e.preventDefault(); $("find").value = ""; refilter("");
  } else if (e.key === "Enter" && document.activeElement === $("find")) {
    // Enter goes to the first match and lights it up.
    const first = document.querySelector(".row");
    if (first) { first.scrollIntoView({ block: "center" }); first.classList.add("lit"); first.querySelector("button, select")?.focus(); }
  }
});

// The app sends new data whenever a setting changes (here or elsewhere).
window.tbSettings = function (d) {
  // The app's echo of a change already shown changes nothing: drawing it
  // again would cut short what is moving.
  const same = JSON.stringify(d) === JSON.stringify(D);
  D = d;
  if (same) return;
  // A keyword saved as typed: the form is done with it.
  const k = kwDraft.key.trim().toLowerCase();
  if (k && D.keywords.some(([x, , u]) => x === k && u === kwDraft.url.trim())) kwDraft = { key: "", name: "", url: "" };
  render();
};
// The app sets the theme's colours, now and whenever the theme changes.
window.tbTheme = function (t) {
  for (const k in t) if (k !== "light" && k !== "still") root.style.setProperty("--" + k, t[k]);
  root.classList.toggle("light", !!t.light);
  root.classList.toggle("still", !!t.still);
};
window.tbTheme(__THEME__);
document.body.classList.add("intro");
render();
setTimeout(() => document.body.classList.remove("intro"), 1200);
</script>
</body>
</html>
