<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New page</title>
<style>
:root {
  --bg: #16161a; --fg: #e8e8ea; --dim: #9a9aa2; --accent: #ffd60a; --accentfg: #16161a;
  --card: #222228; --rule: #34343c;
  --field: color-mix(in srgb, var(--fg) 5%, var(--bg));
  --raised: color-mix(in srgb, var(--fg) 7%, var(--bg));
  --hover: color-mix(in srgb, var(--fg) 8%, transparent);
  --edge: color-mix(in srgb, var(--fg) 11%, transparent);
  --glow: color-mix(in srgb, var(--accent) 13%, transparent);
  --shadow: 0 18px 50px rgba(0, 0, 0, .38), 0 2px 8px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
:root.light { color-scheme: light; --shadow: 0 18px 50px rgba(20, 20, 40, .14), 0 2px 8px rgba(20, 20, 40, .08); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg);
  background-image:
    radial-gradient(620px 300px at 50% 30%, var(--glow), transparent 70%),
    radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--fg) 6%, transparent) 1px, transparent 0);
  background-size: auto, 22px 22px;
  color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
main { width: min(640px, 88vw); margin-bottom: 9vh; }

/* name and icon */
.brand { display: flex; align-items: center; justify-content: center; gap: 14px; margin-bottom: 30px;
  font-size: 34px; font-weight: 720; letter-spacing: -0.03em; }
.brand svg { width: 42px; height: 42px; filter: drop-shadow(0 4px 14px var(--glow)); }

/* the bar */
.bar {
  position: relative; display: flex; align-items: center; height: 56px;
  background: var(--field); border: 1px solid var(--edge); border-radius: 16px;
  box-shadow: 0 1px 0 color-mix(in srgb, var(--fg) 4%, transparent) inset, 0 8px 28px rgba(0, 0, 0, .18);
  transition: border-color .15s, box-shadow .15s;
}
.bar:focus-within { border-color: color-mix(in srgb, var(--accent) 70%, transparent);
  box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 16%, transparent), 0 8px 28px rgba(0, 0, 0, .2); }
.engine {
  display: flex; align-items: center; gap: 9px; height: 42px; margin-left: 7px; padding: 0 10px 0 7px;
  font: inherit; font-weight: 600; font-size: 14px; color: var(--fg); cursor: pointer;
  background: transparent; border: 0; border-radius: 11px; white-space: nowrap;
}
.engine:hover, .engine[aria-expanded="true"] { background: var(--hover); }
.chev { width: 12px; height: 12px; color: var(--dim); transition: transform .15s; }
.engine[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sep { width: 1px; height: 26px; background: var(--edge); margin: 0 4px 0 6px; }
input {
  flex: 1; min-width: 0; height: 100%; padding: 0 14px 0 10px; font: inherit; font-size: 16px;
  color: var(--fg); background: transparent; border: 0; outline: none;
}
input::placeholder { color: var(--dim); }
.enter { margin-right: 12px; font: 600 11.5px/1 ui-monospace, "JetBrains Mono", monospace; color: var(--dim);
  padding: 5px 7px; border: 1px solid var(--edge); border-radius: 7px; opacity: 0; transition: opacity .15s; }
.bar.typed .enter { opacity: 1; }

/* engine badge */
.badge {
  display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; border-radius: 7px;
  font: 750 11.5px/1 system-ui, sans-serif; letter-spacing: -0.03em; color: #fff;
  background: linear-gradient(140deg, color-mix(in srgb, var(--c) 82%, #fff), var(--c) 55%, color-mix(in srgb, var(--c) 78%, #000));
  box-shadow: 0 1px 0 rgba(255, 255, 255, .25) inset, 0 2px 6px color-mix(in srgb, var(--c) 35%, transparent);
  text-shadow: 0 1px 1px rgba(0, 0, 0, .25);
}

.badge { position: relative; overflow: hidden; }
.badge img { display: none; }
.badge.img { background: none; box-shadow: none; color: transparent; text-shadow: none; }
.badge.img img { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }

/* the list of engines */
.menu {
  position: absolute; top: calc(100% + 10px); left: 0; z-index: 5; width: 360px; max-height: 430px;
  overflow-y: auto; padding: 8px; background: var(--card); border: 1px solid var(--edge); border-radius: 16px;
  box-shadow: var(--shadow); opacity: 0; transform: translateY(-6px) scale(.98); transform-origin: 30px 0;
  pointer-events: none; transition: opacity .14s, transform .14s; scrollbar-width: thin;
}
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.group { padding: 10px 10px 5px; font-size: 11px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
.item { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
.item .badge { width: 30px; height: 30px; border-radius: 9px; font-size: 13px; }
.item .txt { flex: 1; min-width: 0; }
.item .nm { font-weight: 600; font-size: 14px; }
.item .pt { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.hi { background: var(--hover); }
.tick { width: 16px; height: 16px; color: var(--accent); visibility: hidden; }
.item.on .tick { visibility: visible; }
.foot { display: flex; align-items: center; gap: 8px; margin: 6px 2px 2px; padding: 10px; border-top: 1px solid var(--edge);
  font-size: 13px; font-weight: 600; color: var(--dim); cursor: pointer; border-radius: 0 0 10px 10px; }
.foot:hover { color: var(--fg); }

/* under the bar */
.note { margin-top: 16px; text-align: center; font-size: 13px; color: var(--dim); min-height: 20px; }
.note b { color: color-mix(in srgb, var(--fg) 85%, var(--bg)); font-weight: 600; }

/* help */
.help {
  position: fixed; right: 22px; bottom: 22px; display: flex; align-items: center; gap: 0; height: 42px; padding: 0 13px;
  font: inherit; font-size: 13.5px; font-weight: 600; color: var(--fg); cursor: pointer;
  background: var(--raised); border: 1px solid var(--edge); border-radius: 21px; box-shadow: var(--shadow);
  transition: gap .18s, background .15s;
}
.help .q { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
  background: var(--accent); color: var(--accentfg); font-size: 12px; font-weight: 800; }
.help .lbl { max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width .2s; }
.help:hover { gap: 9px; background: var(--card); }
.help:hover .lbl { max-width: 240px; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1.5" y="3" width="9" height="7" rx="2" fill="var(--accent)"/>
      <rect x="15.5" y="9.5" width="9" height="7" rx="2" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <rect x="6" y="18" width="9" height="6" rx="2" fill="none" stroke="var(--dim)" stroke-width="1.6"/>
      <path d="M10.5 6.5 C 14 6.5, 12 13, 15.5 13" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    </svg>
    Trailboard
  </div>
  <form id="f" autocomplete="off">
    <div class="bar" id="bar">
      <button type="button" class="engine" id="engine" aria-haspopup="listbox" aria-expanded="false" title="Choose a search engine">
        <span id="eb" style="display:contents"></span><span id="en"></span>
        <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="sep"></span>
      <input id="q" type="text" autofocus spellcheck="false" aria-label="Search or address">
      <span class="enter">↵ Enter</span>
      <div class="menu" id="menu" role="listbox"></div>
    </div>
  </form>
  <div class="note" id="note"></div>
</main>
<button class="help" id="help" type="button" title="Which search engine is for me?">
  <span class="q">?</span><span class="lbl">Which search engine is for me?</span>
</button>
<script>
const PREFIX = __PREFIX__;
const D = __DATA__;
const $ = (id) => document.getElementById(id);
const byId = (id) => D.engines.find((e) => e.id === id) || D.engines[0];
function act(msg) { console.log(PREFIX + msg); }
// An engine's badge: its own icon from the web, over its letters, which
// show while the icon loads or if it can't.
function badge(e, style = "") {
  return `<span class="badge" style="--c:${e.colour};${style}">${e.mark}<img src="${e.icon}" alt="" onload="this.parentNode.classList.add('img')" onerror="this.remove()"></span>`;
}
const TICK = '<svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// The engine in use: the button, the placeholder and the line under the bar.
window.tbEngine = function (id) {
  D.current = id;
  const e = byId(id);
  $("eb").innerHTML = badge(e);
  $("en").textContent = e.name;
  $("q").placeholder = e.id === "wolframalpha" ? "Ask WolframAlpha or type an address" : `Search ${e.name} or type an address`;
  $("note").innerHTML = `<b>${e.name}</b> · ${e.pitch}`;
  for (const el of document.querySelectorAll(".item")) el.classList.toggle("on", el.dataset.id === id);
};

// The list, by group.
let html = "";
for (const g of D.groups) {
  const list = D.engines.filter((e) => e.group === g.id);
  if (!list.length) continue;
  html += `<div class="group">${g.name}</div>`;
  for (const e of list) {
    html += `<div class="item" role="option" data-id="${e.id}">${badge(e)}<div class="txt"><div class="nm">${e.name}</div><div class="pt">${e.pitch}</div></div>${TICK}</div>`;
  }
}
html += `<div class="foot" id="compare">Compare search engines <span aria-hidden="true">→</span></div>`;
$("menu").innerHTML = html;
const items = [...document.querySelectorAll(".item")];
let hi = -1;

function highlight(i) {
  hi = (i + items.length) % items.length;
  items.forEach((el, k) => el.classList.toggle("hi", k === hi));
  items[hi].scrollIntoView({ block: "nearest" });
}
function openMenu(open) {
  $("menu").classList.toggle("open", open);
  $("engine").setAttribute("aria-expanded", String(open));
  if (open) {
    // Fit the list in the page: it ends a little above the bottom edge.
    const top = $("menu").getBoundingClientRect().top;
    $("menu").style.maxHeight = Math.max(160, Math.min(460, innerHeight - top - 18)) + "px";
  }
  if (open) highlight(Math.max(0, items.findIndex((el) => el.dataset.id === D.current)));
  else $("q").focus();
}
const isOpen = () => $("menu").classList.contains("open");
function choose(id) {
  window.tbEngine(id);
  act("engine:" + id);
  openMenu(false);
}

$("engine").addEventListener("click", () => openMenu(!isOpen()));
$("engine").addEventListener("mousedown", (e) => e.preventDefault());
for (const el of items) {
  el.addEventListener("click", () => choose(el.dataset.id));
  el.addEventListener("mousemove", () => { if (items[hi] !== el) highlight(items.indexOf(el)); });
}
$("compare").addEventListener("click", () => { openMenu(false); act("engines"); });
$("help").addEventListener("click", () => act("engines"));
document.addEventListener("mousedown", (e) => { if (isOpen() && !$("bar").contains(e.target)) openMenu(false); });
document.addEventListener("keydown", (e) => {
  if (!isOpen()) return;
  if (e.key === "ArrowDown") highlight(hi + 1);
  else if (e.key === "ArrowUp") highlight(hi - 1);
  else if (e.key === "Enter") choose(items[hi].dataset.id);
  else if (e.key === "Escape") openMenu(false);
  else return;
  e.preventDefault();
});
$("q").addEventListener("input", () => $("bar").classList.toggle("typed", $("q").value.trim() !== ""));

// Enter asks the app to load what was typed in this card.
$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  if (isOpen()) return;
  const q = $("q").value.trim();
  if (q) act("go:" + q);
});

// The app sets the theme's colours, now and whenever the theme changes.
window.tbTheme = function (t) {
  for (const k in t) if (k !== "light") document.documentElement.style.setProperty("--" + k, t[k]);
  document.documentElement.classList.toggle("light", !!t.light);
};
window.tbTheme(__THEME__);
window.tbEngine(D.current);
$("q").focus();
</script>
</body>
</html>
