<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New page</title>
<style>
/* The start page: one search field, and the pages opened last so the way
   back is one click. Flat on the card's own level (the card already floats
   on the board), the field a recess in it, the engine list a panel over it.
   Colours come from the app (`tbTheme`); corners follow Hyprland. */
:root {
  --bg: #1b1c22; --fg: #e6e6e9; --dim: #a0a0a8; --faint: #7a7a83;
  --accent: #ffd60a; --accentfg: #000; --accenttext: #ffd60a; --accentsoft: #4a4426;
  --card: #24252c; --hover: #2c2d35; --well: #16171c; --rule: #34353d; --rulestrong: #4a4b55;
  --shade: #000;
  --radius: 0px;
  --r: min(12px, var(--radius)); --r-sm: min(6px, var(--radius));
  --font: "Inter", "Adwaita Sans", system-ui, sans-serif;
  color-scheme: dark;
}
:root.light { color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 13px/1.5 var(--font); font-feature-settings: "cv11";
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input { font: inherit; color: inherit; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accenttext); outline-offset: 2px; }
/* The field shows focus on the whole bar. */
input:focus-visible { outline: none; }
::selection { background: var(--accentsoft); }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5;
  stroke-linecap: round; stroke-linejoin: round; }

/* The column sits a little above the middle, where the eye starts. */
main { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -30%);
  width: min(620px, calc(100vw - 48px)); }

.brand { display: flex; align-items: center; gap: 10px; margin: 0 0 20px 2px; font-size: 15px; font-weight: 600;
  color: var(--dim); letter-spacing: -0.01em; }
.brand svg { width: 22px; height: 22px; }

/* the field */
.bar { position: relative; display: flex; align-items: center; height: 52px;
  background: var(--well); border: 1px solid var(--rule); border-radius: var(--r);
  transition: border-color .12s, box-shadow .12s; }
.bar:hover { border-color: var(--rulestrong); }
.bar:focus-within { border-color: var(--accenttext); box-shadow: 0 0 0 3px var(--accentsoft); }
.engine { display: flex; align-items: center; gap: 8px; height: 36px; margin-left: 8px; padding: 0 8px 0 7px;
  font-weight: 600; color: var(--dim); cursor: pointer; background: transparent; border: 0;
  border-radius: var(--r-sm); white-space: nowrap; }
.engine:hover, .engine[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
.engine .chev { width: 12px; height: 12px; color: var(--faint); transition: transform .12s; }
.engine[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sep { width: 1px; height: 22px; background: var(--rule); margin: 0 4px; }
input { flex: 1; min-width: 0; height: 100%; padding: 0 12px 0 10px; font-size: 15px; background: transparent; border: 0; }
input::placeholder { color: var(--faint); }
/* What Enter will do, once something is typed. */
.enter { display: flex; align-items: center; gap: 8px; margin-right: 12px; font-size: 12px; color: var(--dim);
  white-space: nowrap; opacity: 0; transition: opacity .12s; pointer-events: none; }
.bar.typed .enter { opacity: 1; }
kbd { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px;
  font: 600 11px/1 var(--font); color: var(--dim); background: var(--hover);
  border: 1px solid color-mix(in srgb, var(--rulestrong) 55%, transparent); border-radius: min(4px, var(--radius)); }

/* an engine's badge: its icon, or its letters on its colour */
.badge { position: relative; overflow: hidden; display: inline-grid; place-items: center; flex: none;
  width: 20px; height: 20px; border-radius: min(4px, var(--radius));
  font: 700 10px/1 var(--font); letter-spacing: -0.03em; color: #fff; background: var(--c); }
.badge img { display: none; }
.badge.img { background: none; color: transparent; }
.badge.img img { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }

/* the engine list: a panel over the page */
.menu { position: absolute; top: calc(100% + 8px); left: 0; z-index: 5; width: 360px; max-height: 430px;
  overflow-y: auto; padding: 4px; background: var(--card); border: 1px solid var(--rule); border-radius: var(--r);
  box-shadow: 0 1px 3px color-mix(in srgb, var(--shade) 30%, transparent), 0 12px 32px color-mix(in srgb, var(--shade) 40%, transparent);
  opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .12s, transform .12s; scrollbar-width: thin; }
:root.light .menu { box-shadow: 0 1px 3px color-mix(in srgb, var(--shade) 14%, transparent), 0 12px 32px color-mix(in srgb, var(--shade) 16%, transparent); }
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.group { padding: 10px 10px 4px; font-size: 11px; font-weight: 600; color: var(--dim); }
.item { display: flex; align-items: center; gap: 12px; padding: 6px 10px; border-radius: var(--r-sm); cursor: pointer; }
.item .badge { width: 24px; height: 24px; font-size: 11px; }
.item .txt { flex: 1; min-width: 0; }
.item .nm { font-weight: 600; }
.item .pt { font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.hi { background: var(--hover); }
.item .tick { color: var(--accenttext); visibility: hidden; }
.item.on .tick { visibility: visible; }
.foot { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 0; padding: 10px 10px 6px;
  border-top: 1px solid var(--rule); font-weight: 600; color: var(--dim); cursor: pointer; }
.foot:hover { color: var(--fg); }

/* recently opened */
.recent { margin: 28px 0 0; }
.recent h2 { display: flex; align-items: center; justify-content: space-between; margin: 0 0 6px 10px;
  font-size: 12px; font-weight: 600; color: var(--dim); }
.recent ul { list-style: none; margin: 0; padding: 0; }
.recent button { display: flex; align-items: center; gap: 12px; width: 100%; height: 36px; padding: 0 10px; text-align: left;
  border: 0; border-radius: var(--r-sm); background: transparent; cursor: pointer; }
.recent button:hover, .recent button:focus-visible { background: var(--hover); outline: none; }
.tile { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border-radius: min(4px, var(--radius));
  background: var(--hover); color: var(--dim); font: 700 10px/1 var(--font); text-transform: uppercase; }
.recent .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent .h { flex: none; max-width: 40%; font-size: 12px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.recent button:hover .h { color: var(--dim); }

.under { display: flex; justify-content: center; margin-top: 24px; }
.link { font-weight: 500; color: var(--dim); background: none; border: 0; padding: 4px 6px; cursor: pointer; border-radius: var(--r-sm); }
.link:hover { color: var(--fg); }

/* A low card: no recent pages, the column centred. */
@media (max-height: 420px) { .recent { display: none; } main { top: 50%; transform: translate(-50%, -50%); } }
@media (max-width: 460px) { #en, .sep { display: none; } .enter span { display: none; } }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1.5" y="3" width="9" height="7" rx="1.5" fill="var(--accent)"/>
      <rect x="15.5" y="9.5" width="9" height="7" rx="1.5" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <rect x="6" y="18" width="9" height="6" rx="1.5" fill="none" stroke="var(--dim)" stroke-width="1.6"/>
      <path d="M10.5 6.5 C 14 6.5, 12 13, 15.5 13" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    </svg>
    Trailboard
  </div>
  <form id="f" autocomplete="off">
    <div class="bar" id="bar">
      <button type="button" class="engine" id="engine" aria-haspopup="listbox" aria-expanded="false" title="Choose a search engine">
        <span id="eb" style="display:contents"></span><span id="en"></span>
        <svg class="i chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <span class="sep"></span>
      <input id="q" type="text" autofocus spellcheck="false" aria-label="Search or address">
      <span class="enter"><span id="does">Search</span><kbd>Enter</kbd></span>
      <div class="menu" id="menu" role="listbox"></div>
    </div>
  </form>
  <div class="recent" id="recent" hidden>
    <h2>Recently opened</h2>
    <ul id="rlist"></ul>
  </div>
  <div class="under"><button class="link" id="help" type="button">Which search engine is for me?</button></div>
</main>
<script>
const PREFIX = __PREFIX__;
const D = __DATA__;
const RECENT = __RECENT__;
const $ = (id) => document.getElementById(id);
const byId = (id) => D.engines.find((e) => e.id === id) || D.engines[0];
function act(msg) { console.log(PREFIX + msg); }
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// An engine's badge: its own icon from the web, over its letters, which
// show while the icon loads or if it can't.
function badge(e) {
  return `<span class="badge" style="--c:${e.colour}">${e.mark}<img src="${e.icon}" alt="" onload="this.parentNode.classList.add('img')" onerror="this.remove()"></span>`;
}
const TICK = '<svg class="i tick" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"/></svg>';

// The engine in use: the button and the placeholder.
window.tbEngine = function (id) {
  D.current = id;
  const e = byId(id);
  $("eb").innerHTML = badge(e);
  $("en").textContent = e.name;
  $("q").placeholder = e.id === "wolframalpha" ? "Ask WolframAlpha or type an address" : `Search ${e.name} or type an address`;
  for (const el of document.querySelectorAll(".item")) el.classList.toggle("on", el.dataset.id === id);
  $("q").dispatchEvent(new Event("input")); // the Enter hint names the engine
};

// The list, by group.
let html = "";
for (const g of D.groups) {
  const list = D.engines.filter((e) => e.group === g.id);
  if (!list.length) continue;
  html += `<div class="group">${g.name}</div>`;
  for (const e of list) {
    html += `<div class="item" role="option" data-id="${e.id}">${badge(e)}<div class="txt"><div class="nm">${e.name}</div><div class="pt">${e.pitch}</div></div>${TICK}</div>`;
  }
}
html += `<div class="foot" id="compare"><span>Compare search engines</span><span aria-hidden="true">→</span></div>`;
$("menu").innerHTML = html;
const items = [...document.querySelectorAll(".item")];
let hi = -1;

function highlight(i) {
  hi = (i + items.length) % items.length;
  items.forEach((el, k) => el.classList.toggle("hi", k === hi));
  items[hi].scrollIntoView({ block: "nearest" });
}
function openMenu(open) {
  $("menu").classList.toggle("open", open);
  $("engine").setAttribute("aria-expanded", String(open));
  if (open) {
    // Fit the list in the page: it ends a little above the bottom edge.
    const top = $("menu").getBoundingClientRect().top;
    $("menu").style.maxHeight = Math.max(160, Math.min(460, innerHeight - top - 18)) + "px";
    highlight(Math.max(0, items.findIndex((el) => el.dataset.id === D.current)));
  } else $("q").focus();
}
const isOpen = () => $("menu").classList.contains("open");
function choose(id) {
  window.tbEngine(id);
  act("engine:" + id);
  openMenu(false);
}

$("engine").addEventListener("click", () => openMenu(!isOpen()));
$("engine").addEventListener("mousedown", (e) => e.preventDefault());
for (const el of items) {
  el.addEventListener("click", () => choose(el.dataset.id));
  el.addEventListener("mousemove", () => { if (items[hi] !== el) highlight(items.indexOf(el)); });
}
$("compare").addEventListener("click", () => { openMenu(false); act("engines"); });
$("help").addEventListener("click", () => act("engines"));
document.addEventListener("mousedown", (e) => { if (isOpen() && !$("bar").contains(e.target)) openMenu(false); });

// Pages opened last: a click (or Enter on one) loads it in this card.
const host = (u) => { try { return new URL(u).host.replace(/^www\./, ""); } catch { return u; } };
if (RECENT.length) {
  $("rlist").innerHTML = RECENT.map(([title, url]) => {
    const h = host(url);
    return `<li><button type="button" data-url="${esc(url)}" title="${esc(url)}"><span class="tile">${esc((h.match(/[a-z0-9]/i) || ["·"])[0])}</span><span class="t">${esc(title || url)}</span><span class="h">${esc(h)}</span></button></li>`;
  }).join("");
  $("recent").hidden = false;
  for (const b of document.querySelectorAll("#rlist button")) b.addEventListener("click", () => act("go:" + b.dataset.url));
}
const rows = () => [...document.querySelectorAll("#rlist button")];

document.addEventListener("keydown", (e) => {
  if (isOpen()) {
    if (e.key === "ArrowDown") highlight(hi + 1);
    else if (e.key === "ArrowUp") highlight(hi - 1);
    else if (e.key === "Enter") choose(items[hi].dataset.id);
    else if (e.key === "Escape") openMenu(false);
    else return;
    e.preventDefault();
    return;
  }
  // ↓ from the field walks into the recent pages, ↑ back out.
  const r = rows(), at = r.indexOf(document.activeElement);
  if (e.key === "ArrowDown" && (document.activeElement === $("q") || at >= 0) && r.length) {
    r[Math.min(at + 1, r.length - 1)].focus();
  } else if (e.key === "ArrowUp" && at >= 0) {
    (at === 0 ? $("q") : r[at - 1]).focus();
  } else return;
  e.preventDefault();
});
// Says whether Enter will search or open an address, by the same rule as
// the app (`omnibox::resolve`).
const SCHEMES = ["http://", "https://", "file://", "about:", "chrome://", "data:"];
const looksLikeAddress = (t) =>
  SCHEMES.some((p) => t.startsWith(p)) || (!/\s/.test(t) && (t.includes(".") || t.startsWith("localhost")) && !t.endsWith("."));
$("q").addEventListener("input", () => {
  const t = $("q").value.trim();
  $("bar").classList.toggle("typed", t !== "");
  if (t) $("does").textContent = looksLikeAddress(t) ? "Go to address" : "Search " + byId(D.current).name;
});

// Enter asks the app to load what was typed in this card.
$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  if (isOpen()) return;
  const q = $("q").value.trim();
  if (q) act("go:" + q);
});

// The app sets the theme's colours, now and whenever the theme changes.
window.tbTheme = function (t) {
  for (const k in t) if (k !== "light") document.documentElement.style.setProperty("--" + k, t[k]);
  document.documentElement.classList.toggle("light", !!t.light);
};
window.tbTheme(__THEME__);
window.tbEngine(D.current);
$("q").focus();
</script>
</body>
</html>
