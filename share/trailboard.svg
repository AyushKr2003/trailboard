<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Trailboard</title>
  <desc>A trail of five pages stepping down a board, each joined to the page it opened. The pages are drawn as loading skeletons, each a different kind of page; the first is pale, the rest take the default theme's blue, magenta, orange and yellow.</desc>
  <!-- No filters or masks: launchers that draw SVG without them (Qt) see the same icon. -->
  <g transform="translate(256 256) scale(1.16) translate(-256 -256)">
    <!-- The trail: each step in the colour of the page it leads to. -->
    <path d="M144 144L256 144" stroke="#7aa2f7" stroke-width="32"/>
    <path d="M256 144L256 256" stroke="#bb9af7" stroke-width="32"/>
    <path d="M256 256L368 256" stroke="#ff9e64" stroke-width="32"/>
    <path d="M368 256L368 368" stroke="#ffd60a" stroke-width="32"/>
    <!-- Picture page: a header bar and a large picture. -->
    <rect x="96" y="96" width="96" height="96" rx="24" fill="#a9b1d6"/>
    <g fill="#63687d"><rect x="112" y="112" width="64" height="10" rx="5"/><rect x="112" y="130" width="64" height="46" rx="8"/></g>
    <!-- Article: a heading and lines of text. -->
    <rect x="208" y="96" width="96" height="96" rx="24" fill="#7aa2f7"/>
    <g fill="#536ea8"><rect x="226" y="118" width="60" height="12" rx="6"/><rect x="226" y="140" width="44" height="10" rx="5"/><rect x="226" y="158" width="52" height="10" rx="5"/></g>
    <!-- Profile: a round portrait, a name and text. -->
    <rect x="208" y="208" width="96" height="96" rx="24" fill="#bb9af7"/>
    <g fill="#7f69a8"><circle cx="238" cy="240" r="12"/><rect x="258" y="232" width="30" height="8" rx="4"/><rect x="226" y="266" width="60" height="9" rx="4"/><rect x="226" y="280" width="44" height="9" rx="4"/></g>
    <!-- Gallery: a grid of four tiles. -->
    <rect x="320" y="208" width="96" height="96" rx="24" fill="#ff9e64"/>
    <g fill="#ad6b44"><rect x="336" y="224" width="28" height="28" rx="7"/><rect x="372" y="224" width="28" height="28" rx="7"/><rect x="336" y="260" width="28" height="28" rx="7"/><rect x="372" y="260" width="28" height="28" rx="7"/></g>
    <!-- Image with a caption. -->
    <rect x="320" y="320" width="96" height="96" rx="24" fill="#ffd60a"/>
    <g fill="#ad9207"><rect x="336" y="336" width="64" height="32" rx="8"/><rect x="336" y="378" width="60" height="9" rx="4"/><rect x="336" y="392" width="40" height="9" rx="4"/></g>
  </g>
</svg>
