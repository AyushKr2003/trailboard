<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New page</title>
<style>
:root {
  --bg: #16161a; --fg: #e8e8ea; --dim: #9a9aa2; --accent: #ffd60a; --accentfg: #16161a;
  --card: #222228; --rule: #34343c;
  --field: color-mix(in srgb, var(--fg) 4%, var(--bg));
  --hover: color-mix(in srgb, var(--fg) 7%, transparent);
  --edge: color-mix(in srgb, var(--fg) 12%, transparent);
  --edge-hi: color-mix(in srgb, var(--fg) 22%, transparent);
  --soft: color-mix(in srgb, var(--fg) 62%, var(--bg));
  /* Corners follow Hyprland's window rounding (sharp on Omarchy's default);
     small things are capped at 4px, true circles stay round. */
  --radius: 0px; --r-sm: min(4px, var(--radius));
  color-scheme: dark;
}
:root.light { color-scheme: light; --field: color-mix(in srgb, var(--fg) 3%, var(--bg)); }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
/* Flat: the card already sits on the board, so the page adds no texture or glow. */
body {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--bg); color: var(--fg);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Inter", sans-serif;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}
main { width: min(620px, 86vw); margin-bottom: 12vh; }

/* name and mark */
.brand { display: flex; align-items: center; gap: 11px; margin: 0 0 22px 2px;
  font-size: 22px; font-weight: 680; letter-spacing: -0.02em; }
.brand svg { width: 28px; height: 28px; }

/* the bar */
.bar {
  position: relative; display: flex; align-items: center; height: 54px;
  background: var(--field); border: 1px solid var(--edge); border-radius: var(--radius);
  transition: border-color .12s;
}
.bar:hover { border-color: var(--edge-hi); }
.bar:focus-within { border-color: var(--accent); }
.engine {
  display: flex; align-items: center; gap: 9px; height: 40px; margin-left: 7px; padding: 0 9px 0 7px;
  font: inherit; font-weight: 600; font-size: 13.5px; color: var(--soft); cursor: pointer;
  background: transparent; border: 0; border-radius: var(--r-sm); white-space: nowrap;
}
.engine:hover, .engine[aria-expanded="true"] { background: var(--hover); color: var(--fg); }
.chev { width: 11px; height: 11px; color: var(--dim); transition: transform .12s; }
.engine[aria-expanded="true"] .chev { transform: rotate(180deg); }
.sep { width: 1px; height: 24px; background: var(--edge); margin: 0 4px 0 5px; }
input {
  flex: 1; min-width: 0; height: 100%; padding: 0 12px 0 10px; font: inherit; font-size: 16px;
  color: var(--fg); background: transparent; border: 0; outline: none;
}
input::placeholder { color: var(--dim); }
/* What Enter will do, once something is typed. */
.enter { display: flex; align-items: center; gap: 7px; margin-right: 10px; font-size: 12.5px; color: var(--dim);
  white-space: nowrap; opacity: 0; transition: opacity .12s; }
.enter kbd { font: 600 11px/1 ui-monospace, "JetBrains Mono", monospace; color: var(--soft);
  padding: 4px 6px; border: 1px solid var(--edge); border-radius: var(--r-sm); }
.bar.typed .enter { opacity: 1; }

/* engine badge: its icon, or its letters on its colour */
.badge {
  position: relative; overflow: hidden;
  display: inline-grid; place-items: center; flex: none; width: 22px; height: 22px; border-radius: var(--r-sm);
  font: 750 11px/1 system-ui, sans-serif; letter-spacing: -0.03em; color: #fff; background: var(--c);
}
.badge img { display: none; }
.badge.img { background: none; color: transparent; }
.badge.img img { display: block; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; border-radius: inherit; }

/* the list of engines */
.menu {
  position: absolute; top: calc(100% + 6px); left: -1px; z-index: 5; width: 360px; max-height: 430px;
  overflow-y: auto; padding: 6px; background: var(--card); border: 1px solid var(--edge-hi); border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(0, 0, 0, .28);
  opacity: 0; transform: translateY(-4px); pointer-events: none; transition: opacity .1s, transform .1s; scrollbar-width: thin;
}
:root.light .menu { box-shadow: 0 10px 30px rgba(20, 20, 40, .12); }
.menu.open { opacity: 1; transform: none; pointer-events: auto; }
.group { padding: 10px 10px 4px; font-size: 11px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.item { display: flex; align-items: center; gap: 12px; padding: 7px 10px; border-radius: var(--r-sm); cursor: pointer; }
.item .badge { width: 28px; height: 28px; font-size: 12.5px; }
.item .txt { flex: 1; min-width: 0; }
.item .nm { font-weight: 600; font-size: 14px; }
.item .pt { font-size: 12.5px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item.hi { background: var(--hover); }
.tick { width: 15px; height: 15px; color: var(--accent); visibility: hidden; }
.item.on .tick { visibility: visible; }
.foot { display: flex; align-items: center; justify-content: space-between; margin: 6px 0 0; padding: 10px 10px 6px;
  border-top: 1px solid var(--edge); font-size: 13px; font-weight: 600; color: var(--dim); cursor: pointer; }
.foot:hover { color: var(--fg); }

/* under the bar: the engine in use, and the guide */
.under { display: flex; align-items: baseline; justify-content: space-between; gap: 16px;
  margin: 12px 2px 0; font-size: 13px; color: var(--dim); min-height: 20px; }
.under b { color: var(--soft); font-weight: 600; }
.link { flex: none; font: inherit; font-weight: 600; color: var(--dim); background: none; border: 0; padding: 0; cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--edge-hi); text-underline-offset: 3px; }
.link:hover { color: var(--fg); text-decoration-color: currentColor; }
</style>
</head>
<body>
<main>
  <div class="brand">
    <svg viewBox="0 0 26 26" aria-hidden="true">
      <rect x="1.5" y="3" width="9" height="7" rx="1" fill="var(--accent)"/>
      <rect x="15.5" y="9.5" width="9" height="7" rx="1" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
      <rect x="6" y="18" width="9" height="6" rx="1" fill="none" stroke="var(--dim)" stroke-width="1.6"/>
      <path d="M10.5 6.5 C 14 6.5, 12 13, 15.5 13" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    </svg>
    Trailboard
  </div>
  <form id="f" autocomplete="off">
    <div class="bar" id="bar">
      <button type="button" class="engine" id="engine" aria-haspopup="listbox" aria-expanded="false" title="Choose a search engine">
        <span id="eb" style="display:contents"></span><span id="en"></span>
        <svg class="chev" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span class="sep"></span>
      <input id="q" type="text" autofocus spellcheck="false" aria-label="Search or address">
      <span class="enter"><span id="does">Search</span><kbd>↵</kbd></span>
      <div class="menu" id="menu" role="listbox"></div>
    </div>
  </form>
  <div class="under">
    <span id="note"></span>
    <button class="link" id="help" type="button">Which engine is for me?</button>
  </div>
</main>
<script>
const PREFIX = __PREFIX__;
const D = __DATA__;
const $ = (id) => document.getElementById(id);
const byId = (id) => D.engines.find((e) => e.id === id) || D.engines[0];
function act(msg) { console.log(PREFIX + msg); }
// An engine's badge: its own icon from the web, over its letters, which
// show while the icon loads or if it can't.
function badge(e, style = "") {
  return `<span class="badge" style="--c:${e.colour};${style}">${e.mark}<img src="${e.icon}" alt="" onload="this.parentNode.classList.add('img')" onerror="this.remove()"></span>`;
}
const TICK = '<svg class="tick" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5 6.5 11.5 12.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

// The engine in use: the button, the placeholder and the line under the bar.
window.tbEngine = function (id) {
  D.current = id;
  const e = byId(id);
  $("eb").innerHTML = badge(e);
  $("en").textContent = e.name;
  $("q").placeholder = e.id === "wolframalpha" ? "Ask WolframAlpha or type an address" : `Search ${e.name} or type an address`;
  $("note").innerHTML = `<b>${e.name}</b> · ${e.pitch}`;
  for (const el of document.querySelectorAll(".item")) el.classList.toggle("on", el.dataset.id === id);
  $("q").dispatchEvent(new Event("input")); // the Enter hint names the engine
};

// The list, by group.
let html = "";
for (const g of D.groups) {
  const list = D.engines.filter((e) => e.group === g.id);
  if (!list.length) continue;
  html += `<div class="group">${g.name}</div>`;
  for (const e of list) {
    html += `<div class="item" role="option" data-id="${e.id}">${badge(e)}<div class="txt"><div class="nm">${e.name}</div><div class="pt">${e.pitch}</div></div>${TICK}</div>`;
  }
}
html += `<div class="foot" id="compare"><span>Compare search engines</span><span aria-hidden="true">→</span></div>`;
$("menu").innerHTML = html;
const items = [...document.querySelectorAll(".item")];
let hi = -1;

function highlight(i) {
  hi = (i + items.length) % items.length;
  items.forEach((el, k) => el.classList.toggle("hi", k === hi));
  items[hi].scrollIntoView({ block: "nearest" });
}
function openMenu(open) {
  $("menu").classList.toggle("open", open);
  $("engine").setAttribute("aria-expanded", String(open));
  if (open) {
    // Fit the list in the page: it ends a little above the bottom edge.
    const top = $("menu").getBoundingClientRect().top;
    $("menu").style.maxHeight = Math.max(160, Math.min(460, innerHeight - top - 18)) + "px";
  }
  if (open) highlight(Math.max(0, items.findIndex((el) => el.dataset.id === D.current)));
  else $("q").focus();
}
const isOpen = () => $("menu").classList.contains("open");
function choose(id) {
  window.tbEngine(id);
  act("engine:" + id);
  openMenu(false);
}

$("engine").addEventListener("click", () => openMenu(!isOpen()));
$("engine").addEventListener("mousedown", (e) => e.preventDefault());
for (const el of items) {
  el.addEventListener("click", () => choose(el.dataset.id));
  el.addEventListener("mousemove", () => { if (items[hi] !== el) highlight(items.indexOf(el)); });
}
$("compare").addEventListener("click", () => { openMenu(false); act("engines"); });
$("help").addEventListener("click", () => act("engines"));
document.addEventListener("mousedown", (e) => { if (isOpen() && !$("bar").contains(e.target)) openMenu(false); });
document.addEventListener("keydown", (e) => {
  if (!isOpen()) return;
  if (e.key === "ArrowDown") highlight(hi + 1);
  else if (e.key === "ArrowUp") highlight(hi - 1);
  else if (e.key === "Enter") choose(items[hi].dataset.id);
  else if (e.key === "Escape") openMenu(false);
  else return;
  e.preventDefault();
});
// Says whether Enter will search or open an address, by the same rule as
// the app (`omnibox::resolve`).
const SCHEMES = ["http://", "https://", "file://", "about:", "chrome://", "data:"];
const looksLikeAddress = (t) =>
  SCHEMES.some((p) => t.startsWith(p)) || (!/\s/.test(t) && (t.includes(".") || t.startsWith("localhost")) && !t.endsWith("."));
$("q").addEventListener("input", () => {
  const t = $("q").value.trim();
  $("bar").classList.toggle("typed", t !== "");
  if (t) $("does").textContent = looksLikeAddress(t) ? "Go to address" : "Search " + byId(D.current).name;
});

// Enter asks the app to load what was typed in this card.
$("f").addEventListener("submit", (e) => {
  e.preventDefault();
  if (isOpen()) return;
  const q = $("q").value.trim();
  if (q) act("go:" + q);
});

// The app sets the theme's colours, now and whenever the theme changes.
window.tbTheme = function (t) {
  for (const k in t) if (k !== "light") document.documentElement.style.setProperty("--" + k, t[k]);
  document.documentElement.classList.toggle("light", !!t.light);
};
window.tbTheme(__THEME__);
window.tbEngine(D.current);
$("q").focus();
</script>
</body>
</html>
