# What to build. Sourced by scripts/build-cef.sh; a push that changes this
# file (on the cef-build branch) starts a new build.
#
# Keep CEF_COMMIT in step with the `cef` crate on master
# (crates/web/Cargo.toml: 156.4.0+156.0.26 → CEF 156.0.26+g8ea0c73).

# CEF branch = the Chromium build number (156.0.8078.x → 8078).
CEF_BRANCH=8078
# The CEF commit of the release we pin (the "g…" part of the version).
CEF_COMMIT=8ea0c73
# Short version for the release tag.
CEF_SHORT=156.0.26

# GN build arguments.
#  - proprietary_codecs + ffmpeg_branding=Chrome: H.264, AAC (and MP3 etc.)
#  - enable_platform_hevc + use_vaapi: HEVC through the GPU (VA-API)
#  - enable_widevine: required by CEF anyway; the CDM itself is fetched at run time
#  - chrome_pgo_phase=0, symbol_level=0: no PGO profile, no debug symbols
#  - use_thin_lto=false, is_cfi=false: a plain link that fits a 16 GB runner
#    and one 6-hour job (ThinLTO on libcef.so would not)
GN_DEFINES="is_official_build=true
proprietary_codecs=true
ffmpeg_branding=Chrome
enable_platform_hevc=true
use_vaapi=true
enable_widevine=true
chrome_pgo_phase=0
symbol_level=0
use_thin_lto=false
is_cfi=false
use_sysroot=true"

# What to compile (the minimal distribution needs libcef and its data files;
# cefsimple pulls them in, chrome_sandbox is the setuid helper).
BUILD_TARGETS="cefsimple chrome_sandbox"
