<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Note</title>
<style>
:root { --bg: #1c1c1c; --fg: #e6e6e6; --dim: #9a9a9a; --accent: #ffd60a; --sel: #444; --code: #2a2a2a; --rule: #3a3a3a; }
:root { color-scheme: light dark; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
body { font: 16px/1.55 system-ui, sans-serif; }
::selection { background: var(--sel); }
#view, #src { box-sizing: border-box; padding: 18px max(24px, calc((100% - 46em) / 2)); }
#view { min-height: 100%; overflow-wrap: anywhere; cursor: text; }
#view > :first-child { margin-top: 0; }
#src { display: none; position: fixed; inset: 0; width: 100%; height: 100%; margin: 0; border: 0;
  outline: 0; resize: none; background: var(--bg); color: var(--fg); caret-color: var(--accent);
  font: 15px/1.6 ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace; tab-size: 4; }
#src::placeholder, .empty { color: var(--dim); }
body.editing #view { display: none; }
body.editing #src { display: block; }
h1, h2, h3, h4, h5, h6 { line-height: 1.25; margin: 1.1em 0 0.45em; }
h1 { font-size: 1.7em; } h2 { font-size: 1.35em; } h3 { font-size: 1.15em; }
h4, h5, h6 { font-size: 1em; } h6 { color: var(--dim); }
p, ul, ol, blockquote, pre { margin: 0 0 0.8em; }
ul, ol { padding-left: 1.5em; }
li.task { list-style: none; margin-left: -1.3em; }
li.task > input { margin: 0 0.45em 0 0; vertical-align: -0.1em; accent-color: var(--accent); cursor: pointer; }
li.done { color: var(--dim); text-decoration: line-through; }
a { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
code { font: 0.9em ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace; background: var(--code); padding: 0.1em 0.3em; border-radius: 3px; }
pre { background: var(--code); padding: 0.7em 0.9em; overflow-x: auto; border-radius: 4px; }
pre code { background: none; padding: 0; }
blockquote { border-left: 3px solid var(--accent); padding: 0.1em 0 0.1em 0.9em; color: var(--dim); margin-left: 0; }
blockquote > :last-child { margin-bottom: 0; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 1.2em 0; }
</style>
</head>
<body>
<div id="view"></div>
<textarea id="src" spellcheck="false" placeholder="Write in Markdown…"></textarea>
<script>
"use strict";
// Trailboard note editor. The text lives in the app's board; every change is
// sent back as one console message: PREFIX + the whole text.
const PREFIX = __PREFIX__, OPEN = __OPEN__;
const view = document.getElementById("view");
const src = document.getElementById("src");
let text = __TEXT__;

function send() { console.log(PREFIX + text); }

window.tbTheme = function (t) {
  for (const k in t) document.documentElement.style.setProperty("--" + k, t[k]);
};
window.tbTheme(__THEME__);

// The app changed the text (a quote added to this note).
window.tbSetText = function (t) {
  text = t;
  if (document.body.classList.contains("editing")) {
    const at = src.selectionStart;
    src.value = t;
    src.selectionStart = src.selectionEnd = Math.min(at, t.length);
  } else {
    show();
  }
};

// ---------------------------------------------------------------- Markdown

function esc(s) {
  return s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
}

// Links that make sense outside any page; others are shown as text.
function safeUrl(u) {
  u = u.trim();
  if (/^(https?:|mailto:|file:)/i.test(u)) return u;
  if (/^www\./i.test(u)) return "https://" + u;
  return null;
}

function link(href, label) {
  return '<a href="' + esc(href) + '">' + label + "</a>";
}

function inline(s) {
  const keep = [];
  const put = h => "\u0000" + (keep.push(h) - 1) + "\u0000";
  s = s.replace(/\u0000/g, "");
  s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (m, t, c) => put("<code>" + esc(c.replace(/^ ([\s\S]*) $/, "$1")) + "</code>"));
  s = s.replace(/\\([\\`*_{}\[\]()#+\-.!~>|])/g, (m, c) => put(esc(c)));
  s = s.replace(/!?\[([^\]]*)\]\(\s*(?:<([^>]*)>|((?:[^()\s]|\([^()\s]*\))+))(?:\s+"[^"]*")?\s*\)/g, (m, t, a, b) => {
    const u = a !== undefined ? a : b;
    const h = safeUrl(u);
    const label = t.trim() ? inline(t) : esc(u);
    return put(h ? link(h, label) : label);
  });
  s = s.replace(/<((?:https?|mailto):[^\s>]+)>/gi, (m, u) => put(link(u, esc(u))));
  s = s.replace(/\b(?:https?:\/\/|www\.)[^\s<]*[^\s<.,:;"')\]!?*_]/gi, u => put(link(safeUrl(u), esc(u))));
  s = esc(s);
  s = s.replace(/(\*\*|__)(?=\S)([\s\S]*?\S)\1/g, "<strong>$2</strong>");
  s = s.replace(/\*(?=\S)([\s\S]*?\S)\*/g, "<em>$1</em>");
  s = s.replace(/(^|[^\w])_(?=\S)([\s\S]*?\S)_(?!\w)/g, "$1<em>$2</em>");
  s = s.replace(/~~(?=\S)([\s\S]*?\S)~~/g, "<del>$1</del>");
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => keep[+i]);
}

const FENCE = /^\s{0,3}(`{3,}|~{3,})/;
const HEADING = /^\s{0,3}(#{1,6})(?:\s+(.*?))?\s*$/;
const RULE = /^\s{0,3}([-*_])(\s*\1){2,}\s*$/;
const QUOTE = /^\s{0,3}>/;
const ITEM = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
const blank = t => /^\s*$/.test(t);
const startsBlock = t => FENCE.test(t) || HEADING.test(t) || RULE.test(t) || QUOTE.test(t) || ITEM.test(t);

// Lines are {t: text, n: line number in the note}; blocks carry data-line.
function blocks(L) {
  let out = "", i = 0;
  while (i < L.length) {
    const t = L[i].t, at = ' data-line="' + L[i].n + '"';
    let m;
    if (blank(t)) { i++; continue; }
    if ((m = t.match(FENCE))) {
      const body = [];
      let j = i + 1;
      while (j < L.length && !L[j].t.trim().startsWith(m[1])) body.push(L[j++].t);
      out += "<pre" + at + "><code>" + esc(body.join("\n")) + "</code></pre>";
      i = j + 1;
      continue;
    }
    if ((m = t.match(HEADING))) {
      const k = m[1].length, body = (m[2] || "").replace(/\s+#+$/, "");
      out += "<h" + k + at + ">" + inline(body) + "</h" + k + ">";
      i++;
      continue;
    }
    if (RULE.test(t)) { out += "<hr" + at + ">"; i++; continue; }
    if (QUOTE.test(t)) {
      const inner = [];
      while (i < L.length && QUOTE.test(L[i].t)) {
        inner.push({ t: L[i].t.replace(/^\s{0,3}> ?/, ""), n: L[i].n });
        i++;
      }
      out += "<blockquote" + at + ">" + blocks(inner) + "</blockquote>";
      continue;
    }
    if (ITEM.test(t)) {
      const r = list(L, i);
      out += r.html;
      i = r.next;
      continue;
    }
    const para = [inline(t)];
    i++;
    while (i < L.length && !blank(L[i].t) && !startsBlock(L[i].t)) para.push(inline(L[i++].t));
    out += "<p" + at + ">" + para.join("<br>") + "</p>";
  }
  return out;
}

function list(L, i) {
  const first = L[i].t.match(ITEM);
  const indent = first[1].length, ordered = /\d/.test(first[2]);
  let html = "";
  while (i < L.length) {
    const m = L[i].t.match(ITEM);
    if (!m || m[1].length < indent) break;
    if (m[1].length > indent) {
      const r = list(L, i);
      html = html.replace(/<\/li>$/, "") + r.html + "</li>";
      i = r.next;
      continue;
    }
    if (/\d/.test(m[2]) !== ordered) break;
    let body = m[3], cls = "", box = "";
    const task = body.match(/^\[([ xX])\](?:\s+(.*))?$/);
    if (task) {
      const on = task[1] !== " ";
      box = '<input type="checkbox" data-task="' + L[i].n + '"' + (on ? " checked" : "") + ">";
      body = task[2] || "";
      cls = ' class="task' + (on ? " done" : "") + '"';
    }
    const lines = [inline(body)];
    let j = i + 1;
    while (j < L.length && !blank(L[j].t) && !startsBlock(L[j].t)) lines.push(inline(L[j++].t.trim()));
    html += "<li" + cls + ' data-line="' + L[i].n + '">' + box + lines.join("<br>") + "</li>";
    i = j;
    // A blank line between items of the same list keeps the list going.
    let k = i;
    while (k < L.length && blank(L[k].t)) k++;
    if (k > i) {
      const next = k < L.length && L[k].t.match(ITEM);
      if (next && next[1].length >= indent) i = k; else break;
    }
  }
  const tag = ordered ? "ol" : "ul";
  const start = ordered ? parseInt(first[2], 10) : 1;
  return { html: "<" + tag + (start !== 1 ? ' start="' + start + '"' : "") + ">" + html + "</" + tag + ">", next: i };
}

function render(t) {
  return blocks(t.split("\n").map((t, n) => ({ t, n })));
}

// ---------------------------------------------------------------- view and edit

function show() {
  document.body.classList.remove("editing");
  view.innerHTML = text.trim() ? render(text) : '<p class="empty">Empty note. Click or press Enter to write.</p>';
}

function edit(line) {
  document.body.classList.add("editing");
  src.value = text;
  let at = text.length;
  if (line !== undefined) {
    const lines = text.split("\n");
    at = 0;
    for (let i = 0; i < line && i < lines.length; i++) at += lines[i].length + 1;
    at += (lines[line] || "").length;
  }
  src.focus();
  src.selectionStart = src.selectionEnd = Math.min(at, text.length);
}

view.addEventListener("click", e => {
  const a = e.target.closest("a");
  if (a) {
    e.preventDefault();
    console.log(OPEN + a.href); // the app opens it as a card beside the note
    return;
  }
  const box = e.target.closest("input[data-task]");
  if (box) {
    const n = +box.dataset.task, lines = text.split("\n");
    lines[n] = lines[n].replace(/^((?:\s*>)*\s*(?:[-*+]|\d{1,9}[.)])\s+)\[([ xX])\]/, (m, p, c) => p + (c === " " ? "[x]" : "[ ]"));
    text = lines.join("\n");
    send();
    show();
    return;
  }
  if (!window.getSelection().isCollapsed) return; // selecting text to copy
  const block = e.target.closest("[data-line]");
  edit(block ? +block.dataset.line : undefined);
});

// Enter on the board opens the note for writing, at its end.
window.tbEdit = () => { if (!document.body.classList.contains("editing")) edit(); };

src.addEventListener("input", () => { text = src.value; send(); });
src.addEventListener("blur", show);

src.addEventListener("keydown", e => {
  if (e.key === "Escape") { src.blur(); return; }
  if (e.key === "Tab" && !e.ctrlKey && !e.altKey) {
    e.preventDefault();
    if (!e.shiftKey) document.execCommand("insertText", false, "  ");
    return;
  }
  if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.altKey && src.selectionStart === src.selectionEnd) {
    // Keep a list going; Enter on an empty item ends it.
    const at = src.selectionStart, v = src.value;
    const lineStart = v.lastIndexOf("\n", at - 1) + 1;
    const line = v.slice(lineStart, at);
    const m = line.match(/^(\s*(?:>\s?)*)([-*+]|(\d{1,9})([.)]))(\s+)(\[[ xX]\]\s+)?/);
    if (!m) return;
    e.preventDefault();
    if (line.length === m[0].length && at === (v.indexOf("\n", at) < 0 ? v.length : v.indexOf("\n", at))) {
      src.selectionStart = lineStart;
      document.execCommand("insertText", false, m[1].trimEnd() === "" ? "" : m[1]);
      return;
    }
    const bullet = m[3] ? (parseInt(m[3], 10) + 1) + m[4] : m[2];
    document.execCommand("insertText", false, "\n" + m[1] + bullet + m[5] + (m[6] ? "[ ] " : ""));
  }
});

if (text.trim()) show(); else edit();
</script>
</body>
</html>
